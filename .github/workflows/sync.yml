name: Sync Google Docs
on:
  schedule:
    - cron: "*/30 * * * *"      # har 30 minute (GitHub kabhi thoda late chalata hai)
  workflow_dispatch: {}          # Actions tab > "Run workflow" se turant chalao
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx
      - name: Docs padho, site ka data banao
        run: python3 tools/sync_docs.py
      - name: Kuch badla ho to commit karo (Netlify khud redeploy karega)
        run: |
          if [ -n "$(git status --porcelain js/poems.js js/chapters.js)" ]; then
            git config user.name  "nightwalker-sync"
            git config user.email "sync@users.noreply.github.com"
            git add js/poems.js js/chapters.js
            git commit -m "sync: docs se naya content"
            git push
          else
            echo "Kuch naya nahi."
          fi
