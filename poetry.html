<body class="pw">
<div class="grain" aria-hidden="true"></div>
<header class="top">
  <a class="mark" href="index.html" aria-label="Nightwalker, home">निघ्त वल्केर</a>
  <nav aria-label="Main">
    <a href="poetry.html" aria-current="page">Poetry</a><a href="novel.html">Novel</a><a href="blog.html">Blog</a><a href="photos.html">Photography</a><a href="sketches.html">Sketches</a>
  </nav>
  <span class="tools">
    <button class="mode" id="read" aria-pressed="false" hidden>पढ़ने का मोड</button>
    <button class="mode" id="mode" aria-label="Switch between night and paper">रात ⇄ कागज़</button>
  </span>
</header>

<main>
<section id="toc" aria-label="सारी कविताएँ">
  <div class="toc-head">
    <p class="eyebrow">कविताओं का संग्रह</p>
    <h1><span lang="hi">इशारे शब्दों के</span></h1>
    <p class="epi2">“कि ये कलम उठी हर उस वक्त पे है,<br>जब कोई उस वक्त को समझ न सका।”</p>
    <div class="moods" id="moods" role="group" aria-label="मूड से छाँटें"></div>
    <div class="toc-actions"><button class="btn" id="first">पहली कविता से पढ़ें →</button><button class="btn ghost" id="rand">कोई एक कविता</button></div>
  </div>
  <ol class="list" id="list"></ol>
</section>

<section id="reader" aria-label="कविता" hidden>
  <div class="book">
    <aside class="verso">
      <p class="stamp" id="stamp">№ 01</p>
      <p class="mood-tag" id="mtag"></p>
      <h2 id="rtitle"></h2>
      <p class="count" id="count"></p>
      <div class="pbar"><i id="pfill"></i></div>
      <div class="side-nav"><button class="ln" id="prevD">← पिछली</button><button class="ln" id="tocD">सूची</button><button class="ln" id="nextD">अगली →</button></div>
    </aside>
    <article class="leaf" id="leaf" tabindex="0" aria-live="polite">
      <p class="stamp m" id="stampM"></p>
      <h2 class="m" id="rtitleM"></h2>
      <div class="poem" id="poem"></div>
      <p class="sig">— निघ्त वल्केर</p>
    </article>
  </div>
  <nav class="dock" aria-label="कविता नेविगेशन">
    <button id="prev" aria-label="पिछली कविता">←</button><button id="toc2" aria-label="सूची">सूची</button><button id="next" aria-label="अगली कविता">→</button>
  </nav>
  <p class="hint" id="hint">दाएँ-बाएँ swipe करें, या ← → दबाएँ</p>
</section>
</main>
